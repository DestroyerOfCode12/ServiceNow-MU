# No custom [build] command or [[plugins]] block on purpose: both reliably
# broke Netlify's zero-config Next.js detection/Runtime plugin in practice.
# Prisma migrations run via `postinstall` instead (scripts/migrate.mjs),
# which fires during `npm install`, before Netlify's own auto-detected
# `next build` step — so the framework runtime is never bypassed.

[build.environment]
  NODE_VERSION = "22"
